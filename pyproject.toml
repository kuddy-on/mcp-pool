[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-pool"
dynamic = ["version"]
description = "Multi-account pooling and quota-aware routing gateway for MCP services"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "kuddy-on" }]
license = "MIT"
keywords = ["mcp", "gateway", "proxy", "quota", "model-context-protocol"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.22.1,<1",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.141.1,<1",
  "httpx[http2]>=0.28.1,<1",
  "prometheus-client>=0.26.0,<1",
  "pyjwt>=2.13.0,<3",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "structlog>=26.1.0,<27",
  "typer>=0.27.1,<1",
  "uvicorn[standard]>=0.52.1,<1",
]

[project.urls]
Homepage = "https://github.com/kuddy-on/mcp-pool"
Documentation = "https://github.com/kuddy-on/mcp-pool#readme"
Issues = "https://github.com/kuddy-on/mcp-pool/issues"
Source = "https://github.com/kuddy-on/mcp-pool"

[project.scripts]
mcp-pool = "mcp_pool.cli:app"

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.1,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pool"]

[tool.hatch.version]
path = "src/mcp_pool/__init__.py"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
