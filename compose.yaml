services:
  gateway:
    build: .
    env_file: .env
    environment:
      MCP_POOL_HOST: 0.0.0.0
      MCP_POOL_DATABASE_URL: sqlite+aiosqlite:////app/data/mcp_pool.db
    ports:
      - "8100:8000"
    volumes:
      - mcp_data:/app/data

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  mcp_data:
