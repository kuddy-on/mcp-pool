services:
  gateway:
    build: .
    env_file: .env
    environment:
      MCP_POOL_HOST: 0.0.0.0
      MCP_POOL_DATABASE_URL: sqlite+aiosqlite:////app/data/mcp_pool.db
    ports:
      - "8100:8000"
    volumes:
      - mcp_data:/app/data
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    ports:
      - "3000:8080"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  mcp_data:
