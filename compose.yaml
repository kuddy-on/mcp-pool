services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcp_pool
      POSTGRES_USER: mcp_pool
      POSTGRES_PASSWORD: mcp_pool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_pool -d mcp_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      MCP_POOL_HOST: 0.0.0.0
      MCP_POOL_DATABASE_URL: postgresql+asyncpg://mcp_pool:mcp_pool@postgres:5432/mcp_pool
      MCP_POOL_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
