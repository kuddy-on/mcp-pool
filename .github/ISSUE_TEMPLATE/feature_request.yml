name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Include protocol, security, and compatibility considerations.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: What workarounds or alternative designs did you consider?
